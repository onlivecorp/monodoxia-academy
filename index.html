  <!-- Splash Screen Styles -->
  <style id="splash-styles">
    :root {
      --sp-bg: #fbf8f1;
      --sp-navy: #05224a;
      --sp-gold1: #8a6a1f;
      --sp-gold2: #e6c565;
      --sp-gold3: #b98d2c;
      --sp-glow: rgba(201, 162, 58, 0.18);
    }
    body.splash-active {
      overflow: hidden !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, var(--sp-glow), transparent 60%), var(--sp-bg);
      transition: opacity .9s ease, transform .9s ease, visibility .9s;
      z-index: 999999;
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash.done {
      opacity: 0;
      transform: scale(1.06);
      visibility: hidden;
      pointer-events: none;
    }
    #splash .mark {
      width: min(46vw, 260px, 34vh);
      aspect-ratio: 1;
      position: relative;
    }
    #splash .mark svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    #splash .halo {
      position: absolute;
      inset: -20%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--sp-glow), transparent 65%);
      animation: sp-breathe 3.6s ease-in-out infinite;
    }
    #splash path, #splash circle {
      vector-effect: non-scaling-stroke;
    }
    #splash .navy {
      fill: var(--sp-navy);
      stroke: var(--sp-navy);
    }
    #splash .gold {
      fill: url(#g);
      stroke: #c9a23a;
    }
    #splash .a1, #splash .a2, #splash .a3, #splash .a4, #splash .a5 {
      stroke-width: 1.4;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      fill-opacity: 0;
      animation: sp-draw 1.8s cubic-bezier(.6, .1, .2, 1) forwards, sp-fillin .9s ease forwards;
    }
    #splash .a1 { animation-delay: .2s, 1.4s; }
    #splash .a2 { animation-delay: .5s, 1.9s; }
    #splash .a3 { animation-delay: .8s, 2.0s; }
    #splash .a4 { animation-delay: 1s, 2.1s; }
    #splash .a5 { animation-delay: 1.2s, 2.2s; }
    #splash .dot {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: sp-pop .8s cubic-bezier(.3, 1.6, .5, 1) 2.2s forwards;
    }
    #splash .star {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      stroke: none;
      animation: sp-pop .9s cubic-bezier(.3, 1.6, .5, 1) 2.7s forwards, sp-twinkle 2.4s ease-in-out 3.6s infinite;
    }
    #splash .name {
      margin-top: clamp(8px, 3vh, 28px);
      font-size: clamp(30px, 8.4vw, 60px);
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--sp-navy);
      display: flex;
    }
    #splash .name span {
      opacity: 0;
      transform: translateY(.5em);
      filter: blur(6px);
      animation: sp-rise .9s ease forwards;
    }
    #splash .sub {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2vw, 22px);
      margin-top: 4px;
      width: min(86vw, 520px);
      opacity: 0;
      animation: sp-fade 1s ease 3.4s forwards;
    }
    #splash .sub i {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a23a);
      transform: scaleX(0);
      animation: sp-line 1s ease 3.5s forwards;
    }
    #splash .sub i:last-child {
      background: linear-gradient(270deg, transparent, #c9a23a);
      transform-origin: right;
    }
    #splash .sub i:first-child {
      transform-origin: left;
    }
    #splash .sub b {
      font-weight: 500;
      font-size: clamp(14px, 3.6vw, 24px);
      letter-spacing: .5em;
      margin-right: -.5em;
      background: linear-gradient(100deg, var(--sp-gold1), var(--sp-gold2), var(--sp-gold3), var(--sp-gold2));
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sp-shine 3s linear infinite;
    }
    #splash .tag {
      font: 400 clamp(11px, 2.9vw, 15px) / 1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .08em;
      color: var(--sp-navy);
      opacity: 0;
      margin-top: 14px;
      animation: sp-fade 1s ease 4s forwards;
      text-align: center;
      padding: 0 16px;
    }
    #splash .bar {
      width: min(60vw, 240px);
      height: 2px;
      background: rgba(201, 162, 58, 0.2);
      margin-top: clamp(18px, 4vh, 36px);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: sp-fade .6s ease 3.6s forwards;
    }
    #splash .bar div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--sp-gold1), var(--sp-gold2));
      box-shadow: 0 0 10px var(--sp-gold2);
    }
    #splash .pct {
      font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: .3em;
      color: var(--sp-gold3);
      margin-top: 10px;
      opacity: 0;
      animation: sp-fade .6s ease 3.6s forwards;
    }
    #splash .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--sp-gold2);
      opacity: 0;
      animation: sp-float 6s ease-in infinite;
      pointer-events: none;
    }
    @keyframes sp-draw { to { stroke-dashoffset: 0; } }
    @keyframes sp-fillin { to { fill-opacity: 1; stroke-width: 0; } }
    @keyframes sp-pop { from { opacity: 0; transform: scale(0) rotate(-90deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes sp-twinkle { 50% { transform: scale(1.25) rotate(20deg); filter: drop-shadow(0 0 8px #e6c565); } }
    @keyframes sp-rise { to { opacity: 1; transform: none; filter: none; } }
    @keyframes sp-fade { to { opacity: 1; } }
    @keyframes sp-line { to { transform: scaleX(1); } }
    @keyframes sp-shine { to { background-position: -250% 0; } }
    @keyframes sp-breathe { 50% { transform: scale(1.12); opacity: .7; } }
    @keyframes sp-float { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-120px); } }
    @media (prefers-reduced-motion: reduce) {
      #splash * { animation-duration: .01s !important; animation-delay: 0s !important; }
    }
  </style>

  <script>
    (function initSplash() {
      var sp = document.getElementById('splash');
      var n = document.getElementById('name');
      if (!sp || !n) return;

      var dismissed = false;
      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        sp.classList.add('done');
        document.body.classList.remove('splash-active');
        setTimeout(function() {
          if (sp && sp.parentNode) sp.remove();
          document.dispatchEvent(new Event('splash:done'));
        }, 900);
      }

      // Allow tap/click to dismiss quickly if user desires
      sp.addEventListener('click', dismissSplash);

      'MONODOXIA'.split('').forEach(function(c, i) {
        var s = document.createElement('span');
        s.textContent = c;
        s.style.animationDelay = (3 + i * .08) + 's';
        n.appendChild(s);
      });

      for (var i = 0; i < 14; i++) {
        var d = document.createElement('div');
        d.className = 'sparkle';
        d.style.left = (15 + Math.random() * 70) + '%';
        d.style.top = (50 + Math.random() * 40) + '%';
        d.style.animationDelay = (2 + Math.random() * 4) + 's';
        sp.appendChild(d);
      }

      var f = sp.querySelector('#fill');
      var p = sp.querySelector('#pct');
      var t0 = null;
      var D = 3200;
      var S = 3600;

      function step(t) {
        if (dismissed) return;
        if (!t0) t0 = t;
        var e = t - t0 - S;
        if (e < 0) {
          requestAnimationFrame(step);
          return;
        }
        var k = Math.min(e / D, 1);
        var v = 1 - Math.pow(1 - k, 2.2);
        if (f) f.style.width = (v * 100) + '%';
        if (p) p.textContent = Math.round(v * 100) + '%';

        if (k < 1) {
          requestAnimationFrame(step);
        } else {
          setTimeout(dismissSplash, 500);
        }
      }

      requestAnimationFrame(step);
    })();
  </script>
